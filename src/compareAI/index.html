<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CompareAI — GenAI Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;660;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function() {
    var theme = localStorage.getItem('theme') || 'auto';
    if (theme !== 'auto') document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #fdfcfb; --panel: #ffffff; --ink: #1c1917; --muted: #57534e;
    --line: #e7e5e4; --accent: #0ea5e9; --chip: #f5f3f0;
    --ga: #059669; --preview: #d97706; --limited: #dc2626; --documented: #0ea5e9;
    --partner: #7c3aed; --oss: #57534e; --none: #dc2626; --unknown: #d6d3d1;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1222; --panel: #131d33; --ink: #e8edf5; --muted: #94a3b8;
    --line: #1e3048; --chip: #1a2540; --unknown: #334155;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c1222; --panel: #131d33; --ink: #e8edf5; --muted: #94a3b8;
      --line: #1e3048; --chip: #1a2540; --unknown: #334155;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--line); height: 52px;
    display: flex; align-items: center;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    padding: 0 24px;
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; margin: 0 auto; }
  .header-nav { display: flex; align-items: center; gap: 2rem; }
  .header-brand { display: flex; align-items: center; gap: 0.5rem; color: var(--ink); text-decoration: none; font-weight: 660; font-size: 0.9rem; letter-spacing: -0.025em; }
  .brand-logo { width: 22px; height: 22px; color: var(--accent); }
  .nav-links { display: flex; gap: 1.25rem; }
  .nav-links a { font-size: 0.82rem; font-weight: 500; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--accent); }

  header.ch { padding: 20px 24px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 660; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .banner { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 12px 0 0; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 24px; position: sticky; top: 52px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  .tabs button { background: var(--chip); border: 1px solid var(--line); color: var(--ink); padding: 5px 12px; border-radius: 999px; margin-right: 4px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .tabs button:hover { border-color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=search] { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 180px; font-size: 13px; font-family: inherit; transition: border-color 0.15s; }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .picker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .picker span.lbl, .toggle span.lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace; }
  .picker label, .toggle label { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; background: var(--chip); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; cursor: pointer; transition: border-color 0.15s; }
  .picker label:hover, .toggle label:hover { border-color: var(--muted); }
  main { padding: 8px 24px 60px; }
  .qline { color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; margin: 12px 0 4px; }
  .dim { margin: 22px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .reframe { font-size: 12px; color: var(--muted); font-style: italic; margin: 2px 0 8px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { position: sticky; top: 108px; background: var(--bg); z-index: 3; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  th.cap, td.cap { width: 34%; }
  tr:hover td { background: var(--chip); }
  .cell { cursor: pointer; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 9999px; color: #fff; white-space: nowrap; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }
  .b-ga{background:var(--ga)} .b-preview{background:var(--preview)} .b-limited{background:var(--limited)} .b-documented{background:var(--documented)} .b-partner{background:var(--partner)} .b-oss{background:var(--oss)} .b-none{background:var(--none)} .b-unknown{background:var(--unknown);color:var(--ink)}
  .prod { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); padding: 0 24px 12px; font-family: 'JetBrains Mono', monospace; }
  dialog { border: 1px solid var(--line); border-radius: 14px; max-width: 560px; width: 92%; padding: 0; background: var(--panel); color: var(--ink); box-shadow: 0 24px 48px rgba(0,0,0,0.2); }
  dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(4px); }
  .dlg-h { padding: 16px 18px 8px; border-bottom: 1px solid var(--line); }
  .dlg-b { padding: 14px 18px 18px; }
  .dlg-b .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 12px; font-family: 'JetBrains Mono', monospace; }
  .dlg-b pre { white-space: pre-wrap; font: 12px/1.6 'JetBrains Mono', monospace; background: var(--chip); padding: 10px; border-radius: 8px; margin: 4px 0 0; }
  .dlg-b a { color: var(--accent); word-break: break-all; }
  .close { float: right; cursor: pointer; border: none; background: none; font-size: 20px; color: var(--muted); line-height: 1; transition: color 0.15s; }
  .close:hover { color: var(--ink); }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
  footer { color: var(--muted); font-size: 11px; padding: 0 24px 40px; font-family: 'JetBrains Mono', monospace; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="site-header">
  <div class="header-inner">
    <nav class="header-nav">
      <a href="/" class="header-brand">
        <svg class="brand-logo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
          <circle cx="50" cy="50" r="22" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
          <circle cx="50" cy="50" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
          <circle cx="50" cy="50" r="4" fill="currentColor"/>
          <path d="M50 18 L50 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M50 82 L50 90" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 50 L10 50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M82 50 L90 50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        GenAI Insight
      </a>
      <div class="nav-links">
        <a href="/pulse/">Pulse</a>
        <a href="/compareAI/" class="active">CompareAI</a>
      </div>
    </nav>
  </div>
</div>

<header class="ch">
  <h1>CompareAI</h1>
  <div class="sub">Agentic capability comparison — AWS · Azure · GCP · BytePlus · Alibaba</div>
  <div class="banner" id="banner">Loading…</div>
</header>

<div class="controls">
  <div class="tabs" id="tabs" role="tablist"></div>
  <input type="search" id="search" placeholder="Filter capabilities…" aria-label="Filter capabilities">
  <div class="picker" id="picker"><span class="lbl">Providers</span></div>
  <div class="toggle"><label><input type="checkbox" id="diff"> Differences only</label></div>
  <div class="toggle"><label><input type="checkbox" id="hideUnknown"> Hide unknown</label></div>
</div>

<div class="legend" id="legend"></div>
<main id="main"><p class="empty">Loading data…</p></main>
<footer>
  Generated from <code>data/*.yaml</code>. Every non-blank cell links to a first-party source.
  <code>·</code> = not yet researched. <span id="foot-count"></span>
</footer>

<dialog id="dlg">
  <div class="dlg-h"><button class="close" id="dlgClose" aria-label="Close">×</button>
    <strong id="dlgTitle"></strong><div class="sub" id="dlgSub"></div></div>
  <div class="dlg-b" id="dlgBody"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
